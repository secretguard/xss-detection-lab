# XSS Detection Lab - full stack.
#   app  : vulnerable target + realtime detection + live dashboard
#   zap  : headless OWASP ZAP daemon that actively scans the target
#
# Start everything:   docker compose up --build
# Dashboard:          http://localhost:8000/dashboard
services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # where the app reaches the ZAP daemon (service name on the compose network)
      ZAP_BASE: "http://zap:8080"
      ZAP_API_KEY: ""                       # key disabled below - lab only
      # what ZAP should scan: this app's own vulnerable target
      ZAP_TARGET: "http://app:8000/target/"
    depends_on:
      - zap

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config api.disablekey=true
    # The app reaches ZAP over the internal compose network (zap:8080), so the
    # ZAP API does NOT need to be published to the host. If you want to poke the
    # ZAP API from your machine for debugging, uncomment the block below and pick
    # a free host port (change 8090 if it is already in use).
    # ports:
    #   - "8090:8080"
